services:
  netgateway:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: netgateway-enterprise
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - JWT_SECRET=change-this-to-a-strong-secret-in-production-2026
    # NOTE FOR ENTERPRISE DEPLOYMENTS:
    # If your network devices (Cisco/Aruba/Palo Alto) are on private VLANs
    # reachable only through the host's network interfaces, you can enable:
    # network_mode: "host"
    # (and comment out the ports section above)
    volumes:
      # Host bind mount: all devices, credentials, users, and audit logs persist directly in ./data on your host machine
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

