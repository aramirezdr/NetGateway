# =======================================================
# Nginx Reverse Proxy Configuration for NetGateway
# Supports HTTPS/WSS and long-lived WebSocket CLI sessions
# =======================================================

server {
    listen 80;
    server_name netgateway.tu-empresa.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name netgateway.tu-empresa.local;

    # SSL Certificates (Internal Corporate CA or Let's Encrypt)
    ssl_certificate     /etc/ssl/certs/netgateway.crt;
    ssl_certificate_key /etc/ssl/private/netgateway.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Client body size for firmware/configuration uploads
    client_max_body_size 50M;

    # 1. Reverse Proxy for Static Frontend & REST APIs
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Critical: WebSocket Interactive CLI Endpoint (/api/v1/ws/terminal/*)
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep SSH/PTY sessions open indefinitely without premature timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
