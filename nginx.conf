# =======================================================
# Nginx Reverse Proxy Configuration for NetGateway
# Supports HTTP, HTTPS/WSS, and long-lived WebSocket CLI sessions
# =======================================================

# -------------------------------------------------------------------
# OPCIÓN A: HTTP Directo en Puerto 80 (Para pruebas o redes internas)
# -------------------------------------------------------------------
server {
    listen 80;
    server_name _; # Responde a cualquier IP o hostname

    client_max_body_size 50M;

    # 1. Frontend Web SPA y API REST
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. WebSockets Interactivos para Web CLI (/api/v1/ws/terminal/*)
    location /api/v1/ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evita que las sesiones SSH del CLI se cierren por inactividad
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}

